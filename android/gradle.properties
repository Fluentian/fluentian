org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Low-memory build guardrails (this machine has 7.6GB RAM and OOMs easily):
# run the Kotlin compiler inside the Gradle daemon instead of spawning a second
# ~3.5GB JVM, disable parallel module builds, and cap workers so peak RSS stays
# well under available memory. Reverse these if building on a bigger machine.
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.workers.max=1
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
