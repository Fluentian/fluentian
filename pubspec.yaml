name: fluentian
description: "Fluentian — Premium French learning app for Ethiopian learners"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  google_sign_in: ^6.3.0
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.2.0+3
  percent_indicator: ^4.2.3
  confetti: ^0.8.0
  iconsax: ^0.0.8
  lottie: ^3.3.3
  rive: ^0.14.6
  livekit_client: ^2.5.0
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  just_audio: ^0.9.36
  flutter_tts: ^4.2.3
  video_player: ^2.8.6
  flutter_local_notifications: ^17.1.2
  flutter_markdown: ^0.7.7+1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.jpg"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon.jpg
